name: ci

# Native Windows builds run the complete workspace tests; Linux cross-checks
# the MSVC target using the Windows SDK downloaded by cargo-xwin.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release executable
        run: cargo build --release -p copper-win --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copper-windows-x64-ci
          path: target/release/copper.exe
          if-no-files-found: error
          retention-days: 7

  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Toolchain and ARM64 target (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-pc-windows-msvc
      - name: Test on native ARM64 Windows
        run: cargo test --workspace --target aarch64-pc-windows-msvc --locked
      - name: Build native ARM64 executable
        run: cargo build --release -p copper-win --target aarch64-pc-windows-msvc --locked

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      XWIN_ACCEPT_LICENSE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install clang, lld, and LLVM
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends clang lld llvm
      - name: Toolchain and MSVC target (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cache/cargo-xwin
            ~/.cargo/registry
          key: cargo-xwin-0.23.1-x86_64-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-xwin-0.23.1-x86_64-${{ runner.os }}-
      - name: cargo-xwin 0.23.1
        run: cargo install --locked cargo-xwin --version 0.23.1
      - name: Cross-target Clippy
        run: cargo xwin clippy --workspace --target x86_64-pc-windows-msvc --locked -- -D warnings
