[package]
name = "copper-engine-webview2"
description = "copper-engine on Microsoft Edge WebView2 (Evergreen): visual hosting, profiles, CDP-driven agent input, DNR content filtering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Platform-free pieces (shim decoding, DNR compiler, URL stack, key tables)
# build and unit-test on every host.
copper-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
copper-win-rt.workspace = true
webview2-com.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The DNR compiler is tested against the Mac's own Shield list.
copper-shield.workspace = true

[[example]]
name = "smoke"
path = "examples/smoke/main.rs"

[lints]
workspace = true
